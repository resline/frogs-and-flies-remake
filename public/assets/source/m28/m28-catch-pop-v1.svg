<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img">
  <defs>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="28" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0.18" result="softNoise"/>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0b2b35" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9fddd6"/>
      <stop offset="0.46" stop-color="#4eb2ab"/>
      <stop offset="1" stop-color="#195d70"/>
    </linearGradient>
    <linearGradient id="frogP1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dcf879"/>
      <stop offset="0.52" stop-color="#67bf52"/>
      <stop offset="1" stop-color="#1f7f57"/>
    </linearGradient>
    <linearGradient id="frogP2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe181"/>
      <stop offset="0.5" stop-color="#8fc552"/>
      <stop offset="1" stop-color="#2a825e"/>
    </linearGradient>
    <radialGradient id="gold" cx="45%" cy="35%" r="65%">
      <stop offset="0" stop-color="#fff6a5"/>
      <stop offset="0.52" stop-color="#f1b640"/>
      <stop offset="1" stop-color="#b96e23"/>
    </radialGradient>
  </defs>

  <g filter="url(#paper)"><g filter="url(#glow)">
    <path d="M87.0 64.0 L118.0 64.0" stroke="#fff0a2" stroke-width="7" stroke-linecap="round"/>
<path d="M82.6 77.5 L107.7 95.7" stroke="#fff0a2" stroke-width="7" stroke-linecap="round"/>
<path d="M71.1 85.9 L80.7 115.4" stroke="#fff0a2" stroke-width="7" stroke-linecap="round"/>
<path d="M56.9 85.9 L47.3 115.4" stroke="#fff0a2" stroke-width="7" stroke-linecap="round"/>
<path d="M45.4 77.5 L20.3 95.7" stroke="#fff0a2" stroke-width="7" stroke-linecap="round"/>
<path d="M41.0 64.0 L10.0 64.0" stroke="#fff0a2" stroke-width="7" stroke-linecap="round"/>
<path d="M45.4 50.5 L20.3 32.3" stroke="#fff0a2" stroke-width="7" stroke-linecap="round"/>
<path d="M56.9 42.1 L47.3 12.6" stroke="#fff0a2" stroke-width="7" stroke-linecap="round"/>
<path d="M71.1 42.1 L80.7 12.6" stroke="#fff0a2" stroke-width="7" stroke-linecap="round"/>
<path d="M82.6 50.5 L107.7 32.3" stroke="#fff0a2" stroke-width="7" stroke-linecap="round"/>
    <circle cx="64" cy="64" r="28" fill="#ffd45c" opacity="0.86"/>
    <circle cx="56" cy="56" r="10" fill="#fff4c8" opacity="0.9"/>
  </g></g>
</svg>
