<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img">
  <defs>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="28" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0.18" result="softNoise"/>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0b2b35" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9fddd6"/>
      <stop offset="0.46" stop-color="#4eb2ab"/>
      <stop offset="1" stop-color="#195d70"/>
    </linearGradient>
    <linearGradient id="frogP1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dcf879"/>
      <stop offset="0.52" stop-color="#67bf52"/>
      <stop offset="1" stop-color="#1f7f57"/>
    </linearGradient>
    <linearGradient id="frogP2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe181"/>
      <stop offset="0.5" stop-color="#8fc552"/>
      <stop offset="1" stop-color="#2a825e"/>
    </linearGradient>
    <radialGradient id="gold" cx="45%" cy="35%" r="65%">
      <stop offset="0" stop-color="#fff6a5"/>
      <stop offset="0.52" stop-color="#f1b640"/>
      <stop offset="1" stop-color="#b96e23"/>
    </radialGradient>
  </defs>

  <g filter="url(#paper)"><g transform="translate(128 128) scale(-1 1)" filter="url(#softShadow)">
    <path d="M58 -6 C92 -24, 120 -28, 154 -15" stroke="#ff6f82" stroke-width="14" stroke-linecap="round" fill="none"/>
       <circle cx="158" cy="-14" r="10" fill="#ffd0d7"/>
    <ellipse cx="-48" cy="58" rx="46" ry="20" fill="#245f46" opacity="0.46"/>
    <ellipse cx="38" cy="60" rx="50" ry="21" fill="#245f46" opacity="0.42"/>
    <ellipse cx="0" cy="20" rx="62" ry="54" fill="url(#frogP2)"/>
    <ellipse cx="18" cy="4" rx="45" ry="33" fill="#ecf7a7" opacity="0.58"/>
    <circle cx="-31" cy="-34" r="25" fill="url(#frogP2)"/>
    <circle cx="28" cy="-34" r="25" fill="url(#frogP2)"/>
    <circle cx="-26" cy="-39" r="11" fill="#fffef0"/>
    <circle cx="35" cy="-39" r="11" fill="#fffef0"/>
    <circle cx="-22" cy="-39" r="5" fill="#183034"/>
    <circle cx="39" cy="-39" r="5" fill="#183034"/>
    <path d="M-28 16 C-4 32, 24 30, 44 12" stroke="#1d584b" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.58"/>
    <ellipse cx="-48" cy="30" rx="18" ry="10" fill="#f0b84a" transform="rotate(-20 -48 30)" opacity="0.9"/>
    <ellipse cx="52" cy="30" rx="20" ry="10" fill="#f0b84a" transform="rotate(22 52 30)" opacity="0.82"/>
    <circle cx="-26" cy="8" r="5" fill="#f7ffe0" opacity="0.45"/>
    <circle cx="12" cy="36" r="4" fill="#f7ffe0" opacity="0.35"/>

  </g></g>
</svg>
