<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img">
  <defs>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="28" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0.18" result="softNoise"/>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0b2b35" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9fddd6"/>
      <stop offset="0.46" stop-color="#4eb2ab"/>
      <stop offset="1" stop-color="#195d70"/>
    </linearGradient>
    <linearGradient id="frogP1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dcf879"/>
      <stop offset="0.52" stop-color="#67bf52"/>
      <stop offset="1" stop-color="#1f7f57"/>
    </linearGradient>
    <linearGradient id="frogP2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe181"/>
      <stop offset="0.5" stop-color="#8fc552"/>
      <stop offset="1" stop-color="#2a825e"/>
    </linearGradient>
    <radialGradient id="gold" cx="45%" cy="35%" r="65%">
      <stop offset="0" stop-color="#fff6a5"/>
      <stop offset="0.52" stop-color="#f1b640"/>
      <stop offset="1" stop-color="#b96e23"/>
    </radialGradient>
  </defs>

  <g filter="url(#paper)"><g transform="translate(128 146) scale(1 1)" filter="url(#softShadow)">

    <ellipse cx="-48" cy="84" rx="46" ry="20" fill="#245f46" opacity="0.46"/>
    <ellipse cx="38" cy="86" rx="50" ry="21" fill="#245f46" opacity="0.42"/>
    <ellipse cx="0" cy="42" rx="62" ry="37.8" fill="url(#frogP1)"/>
    <ellipse cx="18" cy="26" rx="45" ry="23.099999999999998" fill="#ecf7a7" opacity="0.58"/>
    <circle cx="-31" cy="-22" r="25" fill="url(#frogP1)"/>
    <circle cx="28" cy="-22" r="25" fill="url(#frogP1)"/>
    <circle cx="-26" cy="-27" r="11" fill="#fffef0"/>
    <circle cx="35" cy="-27" r="11" fill="#fffef0"/>
    <circle cx="-22" cy="-27" r="5" fill="#183034"/>
    <circle cx="39" cy="-27" r="5" fill="#183034"/>
    <path d="M-28 38 C-4 54, 24 52, 44 34" stroke="#1d584b" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.58"/>
    <ellipse cx="-48" cy="42" rx="18" ry="10" fill="#4bd1b1" transform="rotate(-20 -48 42)" opacity="0.9"/>
    <ellipse cx="52" cy="42" rx="20" ry="10" fill="#4bd1b1" transform="rotate(22 52 42)" opacity="0.82"/>
    <circle cx="-26" cy="30" r="5" fill="#f7ffe0" opacity="0.45"/>
    <circle cx="12" cy="58" r="4" fill="#f7ffe0" opacity="0.35"/>
    <g opacity="0.72" fill="none" stroke="#d6fff9" stroke-linecap="round">
        <path d="M-74 76 C-42 54, 4 54, 50 76" stroke-width="8"/>
        <path d="M-94 50 C-76 30, -58 28, -36 48" stroke-width="6"/>
        <path d="M58 48 C82 28, 100 34, 116 58" stroke-width="6"/>
      </g>
  </g></g>
</svg>
